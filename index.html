<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中内マーケット</title>
<style>body{margin:0;font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;background:#ecedea;color:#191b1c;display:grid;place-items:center;min-height:100vh}p{margin:0}</style>
</head>
<body>
<p id="m">中内マーケットを読み込み中…</p>
<script>
  // 入口ページ：画面本体は GAS（getUi）から受け取る。画面の修正は GAS のデプロイだけで反映される。
  var API_URL = 'https://script.google.com/macros/s/AKfycbzRHpq_pneM1PghPu4QtGTv_VFJSfayg_1hVg8DY7hltkiDbmxyNwH7koAwj0TgcH6B/exec';
  var SHIM = "<script>\n\n  // GitHub Pages 版：google.script.run の代わりに、GAS の窓口（doPost）を fetch で呼ぶ\n  var API_URL = 'https://script.google.com/macros/s/AKfycbzRHpq_pneM1PghPu4QtGTv_VFJSfayg_1hVg8DY7hltkiDbmxyNwH7koAwj0TgcH6B/exec';\n  function gasRunner_(ok, ng) {\n    return new Proxy({}, { get: function (_, name) {\n      if (name === 'withSuccessHandler') return function (f) { return gasRunner_(f, ng); };\n      if (name === 'withFailureHandler') return function (f) { return gasRunner_(ok, f); };\n      return function () {\n        var args = Array.prototype.slice.call(arguments);\n        var fail = function (e) { if (ng) ng(e); else console.error(e); };\n        fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },\n          body: JSON.stringify({ fn: name, args: args }), redirect: 'follow' })\n          .then(function (r) { if (!r.ok) throw new Error('通信エラー（' + r.status + '）'); return r.json(); })\n          .then(function (j) {\n            // 画面側の処理で起きたエラーを通信エラーと取り違えないよう、通信の外で呼ぶ\n            setTimeout(function () { if (j.ok) { if (ok) ok(j.result); } else fail(new Error(j.error)); }, 0);\n          }, function (e) {\n            fail(new Error(e && e.message && e.message.indexOf('通信エラー') === 0 ? e.message : 'サーバーにつながりません。もう一度お試しください'));\n          });\n      };\n    } });\n  }\n  var google = { script: { get run() { return gasRunner_(null, null); } } };\n<\/script>";
  fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: 'getUi', args: [] }), redirect: 'follow' })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j.ok) throw new Error(j.error);
      var html = j.result.replace('<base target="_top">', '<title>中内マーケット</title><meta name="viewport" content="width=device-width, initial-scale=1">');
      html = html.replace('<script>', SHIM + '<script>');
      document.open(); document.write(html); document.close();
    })
    .catch(function () {
      document.getElementById('m').textContent = '読み込めませんでした。少し待ってから再読み込みしてください。';
    });
</script>
</body>
</html>
